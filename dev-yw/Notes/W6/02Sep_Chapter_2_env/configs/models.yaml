# Sections 2.3 and 2.4. Each training run takes ONE 2.1 pipeline as input.

input_size: [224, 224]            # PDF: 224 or keep 256; report which
share_2_1_mask: false

lightweight_cnn:                  # 2.3
  name: mobilenet_v3_small        # or efficientnet_b0
  weights: imagenet
  train_from_scratch_control: true
  freeze_backbone_first: true
  unfreeze_last_blocks: 2

transfer:                         # 2.4
  candidates:
    - resnet18
    - mobilenet_v3_small
    - densenet121
    - efficientnet_b3
  default: resnet18
  replace_classifier_head: true
  freeze_feature_extractor: true
