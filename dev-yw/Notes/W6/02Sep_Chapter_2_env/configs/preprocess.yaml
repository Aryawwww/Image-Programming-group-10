# Locked from PlantVillage_Techniques_Conversation_Morning02Sep.pdf §3.3 / §3.7
# These are matrix operators. They are not a neural network.

geometry:
  size: [256, 256]
  interpolation: bicubic          # OpenCV INTER_CUBIC
  keep_aspect_square: true        # PlantVillage leaves are already 1:1

numeric:
  dtype: float32
  value_range: [0.0, 1.0]

unsharp_mask:
  enabled: false                  # PDF optional
  sigma: 1.0
  amount: 0.3

color_spaces:
  keep_rgb: true
  cie_lab: true                   # L = illumination, a* = yellowing/necrosis/rust
  hsv: true                       # H = lesion hue, S = mildew / powder

vegetation_index:
  exg: "2G - R - B"
  exr: "1.4R - G"

illumination:
  gray_world: true
  clahe:
    enabled: true
    channel: L                    # never equalise a* or b*
    clip_limit: 2.0
    tile_grid: [8, 8]
  homomorphic:
    enabled: false                # PDF optional stronger shadow suppression

denoise:
  bilateral:
    enabled: true
    d: 5
    sigma_color: 50.0
    sigma_space: 50.0
  gaussian_or_mean_on_rgb: false  # PDF: do not blur powdery / ring lesions
  median_on_binary_mask_only:
    enabled: true
    ksize: 3

leaf_mask:
  # Used only by the segmented pipeline. Not a front-end for colour/grayscale.
  method: otsu_exg                # otsu_exg | otsu_a_star | official
  morphology:
    open_disk_radius: 3
    close_disk_radius: 3
  keep_largest_component: true
  fill_holes: true
  background: zero                # zero | mean_gray
  lesion_roi:
    enabled: false                # optional second threshold on non-green pixels

gradient:
  operator: scharr                # scharr | sobel
  save_magnitude: true
  canny:
    enabled: false
    low_percentile: 20
    high_percentile: 40

four_channel:
  # Optional extra representation, not a required stage for every model.
  layout: ["L", "a", "b", "grad_magnitude"]
