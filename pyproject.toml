[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "plantvillage-pipeline"
version = "0.1.0"
description = "Reproducible PlantVillage classification pipelines"
requires-python = "==3.11.9"
dependencies = [
  "torch==2.9.0",
  "torchvision==0.24.0",
  "numpy==1.26.4",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "scikit-image==0.24.0",
  "Pillow==10.4.0",
  "pandas==2.2.3",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
  "huggingface-hub==0.26.2",
  "safetensors==0.4.5",
  "joblib==1.4.2",
  "jsonschema==4.23.0",
  "pytest==8.3.3",
]

[project.scripts]
pv-pipeline = "pv_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.plantvillage.environment]
python = "3.11.9"
seed = 42177
canonical_config = "configs/project_config.json"
class_mapping = "configs/classes.json"
reference_requirements = "requirements/reference.txt"
